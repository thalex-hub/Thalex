<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thalex Management - Hệ thống quản trị doanh nghiệp</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234f46e5%22/><path d=%22M30 70 L30 40 L50 30 L70 40 L70 70%22 fill=%22none%22 stroke=%22white%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><path d=%22M30 55 L70 55%22 fill=%22none%22 stroke=%22white%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
    <script>
      // Highly robust suppression of expected benign HMR/Vite socket connection warnings & firebase firestore transport warnings
      (function() {
        if (typeof window !== 'undefined') {
          function shouldSuppress(msg) {
            if (!msg) return false;
            const normalized = msg.toLowerCase();
            return (
              normalized.includes('[vite]') || 
              normalized.includes('websocket') || 
              normalized.includes('hmr') ||
              normalized.includes('@firebase/firestore') ||
              normalized.includes('webchannelconnection') ||
              normalized.includes("rpc 'listen' stream") ||
              normalized.includes('transport errored') ||
              normalized.includes('firestore')
            );
          }

          function processArgs(args) {
            return args.map(arg => {
              try {
                return (arg && typeof arg === 'object') ? JSON.stringify(arg) : String(arg);
              } catch (_) {
                return String(arg);
              }
            }).join(' ');
          }

          const origError = console.error;
          console.error = function(...args) {
            const msg = processArgs(args);
            if (shouldSuppress(msg)) {
              return; // Silence suppressed errors
            }
            origError.apply(console, args);
          };

          const origWarn = console.warn;
          console.warn = function(...args) {
            const msg = processArgs(args);
            if (shouldSuppress(msg)) {
              return; // Silence suppressed warnings
            }
            origWarn.apply(console, args);
          };

          const origLog = console.log;
          console.log = function(...args) {
            const msg = processArgs(args);
            if (shouldSuppress(msg)) {
              return; // Silence suppressed logs
            }
            origLog.apply(console, args);
          };

          window.addEventListener('unhandledrejection', function(event) {
            const reason = event.reason;
            const msg = reason ? (reason.message || String(reason)) : '';
            if (shouldSuppress(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            const message = event.message;
            if (shouldSuppress(message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
